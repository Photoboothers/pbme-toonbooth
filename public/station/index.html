<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Print station · AI Create Booth</title>
<link rel="icon" href="/img/pbme-icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/station/station.css">
</head>
<body class="station">
<header class="st-head">
  <div class="st-brand">Print station · <span id="evname">AI Create Booth</span></div>
  <div class="st-status"><span id="net" class="pill">Connecting…</span> <span id="last" class="muted"></span></div>
  <div class="st-actions">
    <button class="btn big" id="toggle">▶ Start auto-print</button>
    <button class="btn ghost light" id="testprint">Test print</button>
    <button class="btn ghost light" id="help">Printer setup</button>
  </div>
</header>
<section class="st-counts"><div><b id="cWait">0</b>To print</div><div><b id="cPrint">0</b>Printing</div><div><b id="cDone">0</b>Printed</div><div><b id="cVid">0</b>Videos made</div><div><b id="cMail">0</b>Emails sent</div></section>
<main class="st-main"><div id="queue" class="st-queue"></div><p id="empty" class="st-empty">Auto-print is on. Each guest's picture appears here and prints automatically.</p></main>
<iframe id="printframe" title="print" style="position:fixed;width:0;height:0;border:0;right:0;bottom:0"></iframe>
<script type="module" src="/station/station.js"></script>
</body>
</html>
